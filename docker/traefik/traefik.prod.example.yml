api:
  dashboard: true
  insecure: false
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websec
          scheme: https
  websec:
    address: :443
  metrics:
    address: :8082
certificatesResolvers:
  letsencrypt:
    acme:
      email: your-email@example.com
      storage: /etc/traefik/certs/acme.json
      httpChallenge:
        entryPoint: web
providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true
log:
  level: INFO
  format: json
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: false
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.01
      - 0.025
      - 0.05
      - 0.1
      - 0.25
      - 0.5
      - 1
      - 2
      - 5
      - 10
accessLog:
  format: json
  fields:
    defaultMode: drop
    names:
      StartUTC: keep
      RequestMethod: keep
      RequestHost: keep
      RequestPath: keep
      RequestProtocol: keep
      DownstreamStatus: keep
      DownstreamContentSize: keep
      RequestContentSize: keep
      Duration: keep
      OriginDuration: keep
      OriginStatus: keep
      RouterName: keep
      ServiceName: keep
      Overhead: keep
    headers:
      defaultMode: drop
