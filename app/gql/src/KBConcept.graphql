query concept(
  $where: KBConceptWhereUniqueInput!
  $detailedInfo: Boolean = true
) {
  concept(where: $where) {
    ...KBConcept_
  }
}

query concepts(
  $where: KBConceptWhereInput
  $orderBy: KBConceptOrderByInput
  $skip: Int
  $take: Int
  $detailedInfo: Boolean = true
) {
  response: concepts(
    where: $where
    orderBy: $orderBy
    skip: $skip
    take: $take
  ) {
    ...KBConcept_
  }
}

query conceptsCount($where: KBConceptWhereInput) {
  kBConceptsCount(where: $where)
}

query conceptsConnection(
  $where: KBConceptWhereInput
  $orderBy: KBConceptOrderByInput
  $skip: Int
  $take: Int
  $detailedInfo: Boolean = false
) {
  concepts(where: $where, orderBy: $orderBy, skip: $skip, take: $take) {
    ...KBConcept_
  }
  kBConceptsCount(where: $where)
}

fragment KBConceptNoNesting on KBConcept {
  id
  # createdAt
  updatedAt
  type
  name
  description
  intro
  image
  createdById
  code
  parentId
  rootId
  uri
  path
  quality
  visibility
  data
  lat
  lng
  contentMode
  searchable
  packCount
  size
  available
  price
  hast @include(if: $detailedInfo)
  tv @include(if: $detailedInfo)
  content @include(if: $detailedInfo)
}

fragment KBConcept_ on KBConcept {
  ...KBConceptNoNesting
  CreatedBy {
    ...UserNoNesting
  }
  Files {
    id
    File {
      ...FileNoNesting
    }
  }
}

fragment KBConceptSearch on KBConcept {
  id
  name
  uri
  searchImage
  price
  available
}

query searchConcepts($query: String!, $take: Int, $skip: Int) {
  searchConcepts(query: $query, take: $take, skip: $skip) {
    total
    items {
      ...KBConceptSearch
    }
  }
}

mutation requestConceptCallback(
  $conceptId: String!
  $name: String
  $phone: String
) {
  requestConceptCallback(conceptId: $conceptId, name: $name, phone: $phone)
}

mutation submitConceptFeedback(
  $conceptId: String!
  $name: String
  $contact: String!
  $message: String!
) {
  submitConceptFeedback(
    conceptId: $conceptId
    name: $name
    contact: $contact
    message: $message
  )
}

mutation requestConceptQuickOrder(
  $conceptId: String!
  $name: String
  $contact: String!
) {
  requestConceptQuickOrder(
    conceptId: $conceptId
    name: $name
    contact: $contact
  )
}

mutation requestConceptPrintOrder(
  $conceptId: String!
  $data: ConceptPrintOrderInput!
) {
  requestConceptPrintOrder(conceptId: $conceptId, data: $data)
}

mutation addConceptProductToCart(
  $conceptId: String!
  $productId: String!
  $quantity: Int!
) {
  addConceptProductToCart(
    conceptId: $conceptId
    productId: $productId
    quantity: $quantity
  )
}

mutation requestConceptRegistration($conceptId: String!) {
  requestConceptRegistration(conceptId: $conceptId)
}

mutation requestConceptPasswordReset($conceptId: String!) {
  requestConceptPasswordReset(conceptId: $conceptId)
}

mutation requestConceptPayment($conceptId: String!) {
  requestConceptPayment(conceptId: $conceptId)
}
